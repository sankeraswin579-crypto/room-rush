<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room Rush — Trivia together</title><link rel="stylesheet" href="/style.css"></head><body><main><header><b>✦ ROOM RUSH</b><span>● LIVE PARTY GAME</span></header>
<section id="home"><small>THE QUICK-FIRE QUIZ</small><h1>Big brain.<br><em>Good company.</em></h1><p>A tiny trivia showdown for your favorite people. Make a room, share the code, and let the smartest friend win.</p><label for="name">YOUR NAME</label><input id="name" maxlength="20" placeholder="e.g. Alex"><div class="actions"><button id="create">Host a game ↗</button><div><input id="code" maxlength="4" placeholder="ROOM CODE"><button id="join">Join room</button></div></div><div class="steps">01 Host a room　　02 Share the code　　03 Play to win</div><div id="homeError" class="error"></div></section>
<section id="game" class="hidden"><div class="head"><div><small id="role"></small><h2 id="title"></h2></div><div class="room">ROOM CODE <b id="codeShow"></b><button id="copy">Copy</button></div></div><div class="layout"><article><small id="pill"></small><div id="content"></div><div id="controls"></div></article><aside><b>PLAYERS <span id="count"></span></b><div id="players"></div></aside></div><div id="gameError" class="error"></div><button id="leave" class="leave">← Leave room</button></section><footer>MADE FOR THE GROUP CHAT ✦</footer></main><script src="/app.js"></script></body></html>
